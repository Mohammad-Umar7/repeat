[project]
name = "repeat-backend"
version = "0.1.0"
description = "REPEAT local agent service: LangGraph agent, SQLite store, Gmail/Jira/Slack integrations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2.30",
  "openai>=1.40",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "google-auth>=2.32",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.140",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: correctness. I: import order. UP: modern syntax. B: bug-prone patterns. RUF: ruff extras.
# Blind `except Exception` is allowed only at network boundaries and is commented where used,
# so BLE is deliberately not selected. B008 is FastAPI's `File(...)` default idiom.
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repeat*"]
